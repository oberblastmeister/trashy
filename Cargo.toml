[package]
name = "trashy"
version = "2.0.0"
authors = ["Brian Shu <littlebubu.shu@gmail.com>"]
description = """
trashy is a simple, fast, and featureful alternative to rm and trash-cli.
"""
documentation = "https://github.com/oberblastmeister/trashy"
homepage = "https://github.com/oberblastmeister/trashy"
repository = "https://github.com/oberblastmeister/trashy"
readme = "README.md"
keywords = ["trash", "remove", "recycle", "bin", "freedesktop"]
categories = ["command-line-utilities"]
license = "MIT/Apache-2.0"
edition = "2021"
rust-version = "1.87"

[[bin]]
path = "src/main.rs"
name = "trashy"

[dependencies]
clap_mangen = "0.3.4"
clap_complete = "4.6.12"
anyhow = { version = "1.0.104", features = ["backtrace"] }
trash = "5.4.0"
chrono = "0.4.45"
chrono-humanize = "0.2.3"
lscolors = "0.21.0"
once_cell = "1.21.4"
nu-ansi-term = "0.50.3"
humantime = "2.4.0"
regex = "1.13.2"
aho-corasick = "1.1.5"
dialoguer = "0.12.0"
globset = { version = "0.4.19", default-features = false }
either = "1.19.0"
terminal_size = "0.4.4"

[dependencies.tabled]
version = "0.22.0"
default-features = false
features = ["std", "ansi"]

[dependencies.clap]
version = "4.6.9"
features = ["suggestions", "color", "derive", "wrap_help", "cargo"]
